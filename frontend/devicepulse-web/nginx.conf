# The live hub (/api/v1/hubs/live) is a WebSocket. Upgrade requests need the Upgrade and
# Connection headers passed through, which nginx strips by default; everything else keeps a plain
# keep-alive connection to the API.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;

    # Reverse-proxies the API under the same origin as the SPA. This is why the production
    # environment file uses a relative /api/v1 base URL — same origin means no CORS at all,
    # which removes a whole class of deployment misconfiguration.
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;

        # A live connection can sit quiet for longer than nginx's 60s default while nothing is
        # happening; SignalR pings every 15s, so this only has to outlast a missed ping or two.
        proxy_read_timeout 120s;

        # Forwarded so the API's correlation id flows end to end rather than being regenerated
        # at the proxy.
        proxy_set_header   X-Correlation-Id  $http_x_correlation_id;
    }

    location /health/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # Hashed build output is immutable, so it can be cached hard.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # index.html must never be cached, or a browser keeps loading an old build that references
    # chunk filenames the server no longer has.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Client-side routing: anything that is not a real file falls back to index.html so the
    # Angular router can resolve it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        DENY     always;
    add_header Referrer-Policy        no-referrer always;
}
